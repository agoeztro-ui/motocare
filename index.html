<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>MotoCare</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:24px 18px 16px;border-radius:0 0 26px 26px}h1{margin:0;font-size:30px}.sub{color:#cbd5e1}
nav{display:flex;gap:8px;margin-top:16px}nav button{flex:1;padding:12px;border:0;border-radius:13px;background:#374151;color:#ddd;font-weight:700}nav button.active{background:#fff;color:#111827}
main{max-width:760px;margin:auto;padding:15px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #0000000a}
label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:13px;font-size:16px}
.primary{width:100%;padding:14px;margin-top:13px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:850}.muted{color:#6b7280}.hidden{display:none}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.income{color:#15803d}.expense{color:#dc2626}
.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.empty{text-align:center;color:#6b7280;padding:20px}
.secondary{border:0;border-radius:10px;padding:9px 11px;font-weight:700}
</style></head><body>
<header><h1>🛵 MotoCare</h1><div class="sub">Maintenance + Cashflow</div>
<nav><button id="bm" class="active" onclick="tab('moto')">🛵 Kendaraan</button><button id="bf" onclick="tab('finance')">💰 Cashflow</button></nav></header>
<main>
<section id="moto"><div class="card"><h2>🛢️ Reminder Ganti Oli</h2><div class="muted">Vario 125</div>
<label>KM saat ganti terakhir</label><input id="lastKm" type="number" inputmode="numeric">
<label>Interval KM</label><input id="intervalKm" type="number" value="2500">
<label>Tanggal ganti terakhir</label><input id="lastDate" type="date">
<label>Interval waktu (bulan)</label><input id="intervalMonth" type="number" value="6">
<button class="primary" onclick="saveOil()">💾 Simpan Data</button>
<button class="primary" onclick="resetOil()">🔄 Sudah Ganti Oli — Reset</button></div>
<div class="card"><div class="muted">Ganti berikutnya pada KM</div><div class="big" id="nextKm">-</div><div class="muted" id="nextDate">atau -</div></div></section>

<section id="finance" class="hidden"><div class="card"><h2>💰 Cashflow</h2><div class="muted">Catat pemasukan dan pengeluaran.</div>
<div class="grid"><div><label>Jenis</label><select id="type"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div>
<div><label>Kategori</label><input id="cat" placeholder="Gaji / Bensin"></div></div>
<label>Nominal (Rp)</label><input id="amt" type="number" inputmode="numeric" placeholder="0">
<label>Catatan</label><input id="note" placeholder="Opsional">
<button class="primary" onclick="addTx()">➕ Tambah Transaksi</button></div>
<div class="card"><div class="grid"><div><div class="muted">Pemasukan</div><div class="big income" id="inc">Rp0</div></div>
<div><div class="muted">Pengeluaran</div><div class="big expense" id="exp">Rp0</div></div></div><hr><div class="muted">Sisa Cashflow</div><div class="big" id="bal">Rp0</div></div>
<div class="card"><div class="row"><h2>📋 Transaksi</h2><button class="secondary" onclick="clearTx()">Hapus Semua</button></div><div id="list"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
function tab(x){$('moto').classList.toggle('hidden',x!='moto');$('finance').classList.toggle('hidden',x!='finance');$('bm').classList.toggle('active',x=='moto');$('bf').classList.toggle('active',x=='finance')}
let oil=JSON.parse(localStorage.getItem('mc_oil')||'null')||{lastKm:0,intervalKm:2500,lastDate:today(),intervalMonth:6};
function loadOil(){$('lastKm').value=oil.lastKm;$('intervalKm').value=oil.intervalKm;$('lastDate').value=oil.lastDate;$('intervalMonth').value=oil.intervalMonth;renderOil()}
function saveOil(){oil={lastKm:+$('lastKm').value||0,intervalKm:+$('intervalKm').value||2500,lastDate:$('lastDate').value||today(),intervalMonth:+$('intervalMonth').value||6};localStorage.setItem('mc_oil',JSON.stringify(oil));renderOil()}
function addMonths(s,m){let d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+m);return d}
function renderOil(){let d=addMonths(oil.lastDate,oil.intervalMonth);$('nextKm').textContent=(oil.lastKm+oil.intervalKm).toLocaleString('id-ID')+' km';$('nextDate').textContent='atau '+d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}
function resetOil(){oil.lastKm=(+$('lastKm').value||0)+(+$('intervalKm').value||2500);oil.lastDate=today();localStorage.setItem('mc_oil',JSON.stringify(oil));loadOil()}
let tx=JSON.parse(localStorage.getItem('mc_tx')||'[]');
function addTx(){let amount=+$('amt').value;if(amount<=0)return alert('Masukkan nominal.');tx.unshift({type:$('type').value,cat:$('cat').value||'Lainnya',amount,note:$('note').value,date:today()});localStorage.setItem('mc_tx',JSON.stringify(tx));$('amt').value='';$('note').value='';renderTx()}
function renderTx(){let i=tx.filter(x=>x.type=='income').reduce((a,x)=>a+x.amount,0),e=tx.filter(x=>x.type=='expense').reduce((a,x)=>a+x.amount,0);$('inc').textContent=rp(i);$('exp').textContent=rp(e);$('bal').textContent=rp(i-e);$('list').innerHTML=tx.length?tx.map(x=>`<div class="item"><div class="row"><b>${x.cat}</b><b class="${x.type}">${x.type=='income'?'+':'-'} ${rp(x.amount)}</b></div><div class="muted">${x.date}${x.note?' • '+x.note:''}</div></div>`).join(''):'<div class="empty">Belum ada transaksi.</div>'}
function clearTx(){if(confirm('Hapus semua transaksi?')){tx=[];localStorage.setItem('mc_tx','[]');renderTx()}}
loadOil();renderTx();
</script></body></html>
