<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Reminder Ganti Oli</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}
main{max-width:520px;margin:auto}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
h1{margin:0 0 5px;font-size:25px}.muted{color:#6b7280;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;margin-top:10px}
.primary{width:100%;background:#111827;color:#fff}.secondary{background:#eef2f7}
.big{font-size:32px;font-weight:800}.status{margin-top:12px;padding:13px;border-radius:12px;background:#eef2f7;font-weight:700}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section class="card"><h1>🛵 Reminder Ganti Oli</h1><div class="muted">Vario 125 • reset setiap habis ganti oli</div></section>
<section class="card"><div class="grid">
<div><label>KM saat ganti terakhir</label><input id="lastKm" type="number" min="0" value="0"></div>
<div><label>Interval KM</label><input id="intervalKm" type="number" min="100" value="3000"></div>
<div><label>Tanggal ganti terakhir</label><input id="lastDate" type="date"></div>
<div><label>Interval waktu (bulan)</label><input id="months" type="number" min="1" value="6"></div>
</div>
<button class="primary" id="save">🔄 Sudah Ganti Oli — Reset</button>
<button class="secondary" id="notify">🔔 Aktifkan Notifikasi</button></section>
<section class="card"><div class="muted">Ganti berikutnya pada KM</div><div class="big" id="target">3.000 km</div><div class="muted" id="dateTarget">atau -</div><div class="status" id="status">Masukkan KM sekarang.</div></section>
<section class="card"><label>KM sekarang</label><input id="currentKm" type="number" min="0" placeholder="Contoh: 85.000"><button class="secondary" id="check">Cek Status</button></section>
<section class="card muted">Notifikasi akan digunakan untuk mengingatkan saat mendekati batas KM/waktu. Di iPhone, notifikasi web memerlukan aplikasi dipasang ke Home Screen dan izin notifikasi.</section>
</main>
<script>
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('id-ID').format(Math.max(0,Math.round(n))), today=()=>new Date().toISOString().slice(0,10);
function addMonths(s,m){let [y,mo,d]=s.split('-').map(Number),x=new Date(Date.UTC(y,mo-1,d));x.setUTCMonth(x.getUTCMonth()+m);return x.toISOString().slice(0,10)}
function pretty(s){if(!s)return '-';let [y,m,d]=s.split('-');return d+'-'+m+'-'+y}
function get(){return {lastKm:Number($('lastKm').value)||0,intervalKm:Number($('intervalKm').value)||3000,lastDate:$('lastDate').value||today(),months:Number($('months').value)||6,currentKm:Number($('currentKm').value)||0}}
function update(){let s=get(),target=s.lastKm+s.intervalKm,td=addMonths(s.lastDate,s.months);$('target').textContent=fmt(target)+' km';$('dateTarget').textContent='atau '+pretty(td);let msg='Masukkan KM sekarang.';if(s.currentKm){let rem=target-s.currentKm;if(rem<=0)msg='🔴 Sudah waktunya ganti oli berdasarkan KM.';else if(new Date()>=new Date(td+'T23:59:59'))msg='🔴 Sudah waktunya ganti oli berdasarkan waktu.';else if(rem<=500)msg='🟡 Segera ganti oli — sisa '+fmt(rem)+' km.';else msg='🟢 Masih aman — sisa '+fmt(rem)+' km.'}$('status').textContent=msg}
function save(){localStorage.setItem('oilReminder',JSON.stringify(get()));update();$('status').textContent='✅ Reminder di-reset dari KM dan tanggal terakhir.';scheduleLocalReminder()}
function load(){let s=JSON.parse(localStorage.getItem('oilReminder')||'null');if(s){$('lastKm').value=s.lastKm;$('intervalKm').value=s.intervalKm;$('lastDate').value=s.lastDate;$('months').value=s.months;$('currentKm').value=s.currentKm||''}if(!$('lastDate').value)$('lastDate').value=today();update()}
async function enableNotifications(){if(!('Notification'in window)){alert('Browser ini tidak mendukung notifikasi web.');return}let p=await Notification.requestPermission();if(p==='granted'){alert('Notifikasi diizinkan. Untuk notifikasi otomatis di iPhone, pasang aplikasi ini ke Home Screen.');scheduleLocalReminder()}else alert('Izin notifikasi belum diberikan.')}
function scheduleLocalReminder(){/* Reminder status tetap tersedia saat app dibuka; background notification memerlukan service worker + HTTPS hosting. */ if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{})}
$('save').onclick=save;$('check').onclick=update;$('notify').onclick=enableNotifications;['lastKm','intervalKm','lastDate','months','currentKm'].forEach(id=>$(id).addEventListener('input',update));load();scheduleLocalReminder();
</script>
</body></html>
